<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking Blocks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap');

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .tile-frame {
            box-shadow: 0 6px 0 rgba(0,0,0,0.12), 0 10px 15px rgba(0,0,0,0.08);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .tile-frame:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 0 rgba(0,0,0,0.12), 0 14px 20px rgba(0,0,0,0.12);
        }

        .tile-frame:active {
            transform: translateY(2px) scale(0.97);
            box-shadow: 0 3px 0 rgba(0,0,0,0.12), 0 4px 6px rgba(0,0,0,0.08);
        }

        .draggable-tile {
            touch-action: none;
            position: absolute;
            cursor: grab;
            filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.18));
            transition: transform 0.1s ease;
        }

        .draggable-tile:active {
            cursor: grabbing;
            transform: scale(1.08);
            z-index: 10000 !important;
        }

        .board-pattern {
            background-color: #ffffff;
            background-image: radial-gradient(#ffd166 2.5px, transparent 2.5px), radial-gradient(#06d6a0 2.5px, #ffffff 2.5px);
            background-size: 80px 80px;
            background-position: 0 0, 40px 40px;
            border: 6px dashed #ffd166;
        }

        .trash-zone {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .trash-zone.drag-over {
            transform: scale(1.2);
            background-color: #ef476f !important;
            color: #ffffff !important;
            border-color: #ffb703 !important;
            box-shadow: 0 0 25px rgba(239, 71, 111, 0.6);
        }

        .sidebar-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .sidebar-scroll::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.4);
            border-radius: 10px;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb {
            background: #ffd166;
            border-radius: 10px;
            border: 2px solid #ffffff;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden p-3 md:p-4 gap-3">

    <!-- Header -->
    <header class="w-full bg-white/90 backdrop-blur-md rounded-2xl md:rounded-3xl px-4 py-3 shadow-lg border-4 border-white flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
            <span class="text-2xl md:text-3xl animate-bounce">🎨</span>
            <h1 class="text-xl md:text-2xl font-black text-slate-700 font-['Fredoka_One']">Speaking Blocks</h1>
        </div>

        <div class="flex items-center gap-2">
            <!-- Quiz Mode Toggle Button -->
            <button id="quizToggleBtn" title="Quiz Mode" class="bg-purple-500 hover:bg-purple-600 text-white px-3 md:px-4 py-2.5 rounded-2xl shadow-md active:scale-95 transition-all duration-200 border-2 border-purple-300 flex items-center gap-2 font-bold text-sm md:text-base">
                <i class="fa-solid fa-graduation-cap text-lg"></i>
                <span class="hidden sm:inline" id="quizBtnText">Quiz Mode</span>
            </button>

            <!-- Reset Board Button -->
            <button id="clearBoardBtn" title="Clear Board" class="bg-amber-400 hover:bg-amber-500 text-white px-3 md:px-4 py-2.5 rounded-2xl shadow-md active:scale-95 transition-all duration-200 border-2 border-amber-300 flex items-center gap-2 font-bold text-sm md:text-base">
                <i class="fa-solid fa-rotate-right text-lg"></i>
                <span class="hidden sm:inline">Reset</span>
            </button>
        </div>
    </header>

    <!-- App Main Body -->
    <div class="flex-1 w-full flex flex-row gap-3 md:gap-4 overflow-hidden relative">

        <!-- LEFT SIDEBAR: Family Members -->
        <aside class="w-20 sm:w-24 md:w-32 bg-white/80 backdrop-blur-md rounded-2xl md:rounded-3xl p-2 md:p-3 shadow-xl border-4 border-pink-200 flex flex-col items-center shrink-0">
            <div class="text-center pb-2 mb-2 border-b-2 border-pink-100 w-full">
                <span class="text-xl md:text-2xl" title="Family">👨‍👩‍👧‍👦</span>
            </div>
            <div id="familyTilesContainer" class="w-full flex-1 flex flex-col items-center gap-3 overflow-y-auto sidebar-scroll pr-0.5">
                <!-- Family tiles populated dynamically -->
            </div>
        </aside>

        <!-- CENTER WORKSPACE BOARD -->
        <main id="boardCanvas" class="relative flex-1 rounded-2xl md:rounded-3xl board-pattern shadow-inner overflow-hidden">
            <!-- Trash Zone for drag-to-delete -->
            <div id="trashZone" class="trash-zone absolute bottom-3 right-3 md:bottom-4 md:right-4 bg-red-100 text-red-500 border-4 border-red-300 w-14 h-14 md:w-16 md:h-16 rounded-2xl flex items-center justify-center shadow-lg z-10 pointer-events-none">
                <i class="fa-solid fa-trash-can text-xl md:text-2xl"></i>
            </div>
        </main>

        <!-- RIGHT SIDEBAR: Words & Objects -->
        <aside class="w-20 sm:w-24 md:w-32 bg-white/80 backdrop-blur-md rounded-2xl md:rounded-3xl p-2 md:p-3 shadow-xl border-4 border-sky-200 flex flex-col items-center shrink-0">
            <div class="text-center pb-2 mb-2 border-b-2 border-sky-100 w-full">
                <span class="text-xl md:text-2xl" title="Words & Actions">🔤</span>
            </div>
            <div id="otherTilesContainer" class="w-full flex-1 flex flex-col items-center gap-3 overflow-y-auto sidebar-scroll pr-0.5">
                <!-- Other tiles populated dynamically -->
            </div>
        </aside>

        <!-- QUIZ OVERLAY -->
        <div id="quizOverlay" class="hidden absolute inset-0 bg-slate-900/40 backdrop-blur-md z-50 rounded-2xl md:rounded-3xl flex items-center justify-center p-4">
            
            <div class="bg-white border-4 border-purple-300 rounded-3xl p-6 md:p-8 shadow-2xl max-w-lg w-full flex flex-col items-center text-center relative animate-fade-in">
                
                <button id="closeQuizBtn" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>

                <!-- STEP 1: Quiz Category Selection Screen -->
                <div id="quizCategoryState" class="w-full flex flex-col items-center gap-5">
                    <div class="text-4xl">🧩</div>
                    <h2 class="text-2xl font-black font-['Fredoka_One'] text-slate-700">Choose Quiz Category</h2>
                    <p class="text-slate-500 font-bold text-sm">Select which vocabulary set you want to test:</p>
                    
                    <div class="flex flex-col sm:flex-row gap-4 w-full pt-2">
                        <button onclick="selectQuizCategory('family')" class="flex-1 bg-pink-50 hover:bg-pink-100 border-4 border-pink-300 rounded-2xl p-4 flex flex-col items-center gap-2 transition-transform active:scale-95 shadow-md">
                            <span class="text-4xl">👨‍👩‍👧‍👦</span>
                            <span class="font-black text-pink-600 text-lg">Family Words</span>
                        </button>
                        
                        <button onclick="selectQuizCategory('others')" class="flex-1 bg-sky-50 hover:bg-sky-100 border-4 border-sky-300 rounded-2xl p-4 flex flex-col items-center gap-2 transition-transform active:scale-95 shadow-md">
                            <span class="text-4xl">🔤</span>
                            <span class="font-black text-sky-600 text-lg">Other Words</span>
                        </button>
                    </div>
                </div>

                <!-- STEP 2: Active Quiz Screen -->
                <div id="quizActiveState" class="hidden w-full flex flex-col items-center gap-6">
                    <div class="flex items-center justify-between w-full border-b-2 border-slate-100 pb-3">
                        <span class="font-['Fredoka_One'] text-purple-600 text-lg md:text-xl" id="quizQuestionCount">Question 1 of 5</span>
                        <div class="flex items-center gap-1 text-amber-400 text-lg" id="quizStars">
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                        </div>
                    </div>

                    <div class="flex flex-col items-center gap-2">
                        <p class="text-slate-600 font-bold text-sm md:text-base">Listen & choose the matching picture:</p>
                        <button id="playQuizSoundBtn" class="bg-purple-500 hover:bg-purple-600 text-white w-20 h-20 md:w-24 md:h-24 rounded-full flex items-center justify-center shadow-lg active:scale-95 transition-all text-3xl md:text-4xl border-4 border-purple-200">
                            <i class="fa-solid fa-volume-high animate-pulse"></i>
                        </button>
                    </div>

                    <!-- 3 Options Container -->
                    <div id="quizChoicesContainer" class="grid grid-cols-3 gap-3 md:gap-4 w-full pt-2">
                        <!-- 3 Choices Populated Dynamically -->
                    </div>
                </div>

                <!-- STEP 3: Quiz Results Screen -->
                <div id="quizResultState" class="hidden w-full flex flex-col items-center gap-4 py-4">
                    <div class="text-5xl md:text-6xl animate-bounce">🎉</div>
                    <h2 class="text-2xl md:text-3xl font-black font-['Fredoka_One'] text-slate-700">Quiz Completed!</h2>
                    <p class="text-lg font-bold text-purple-600" id="quizScoreText">You scored 5 out of 5!</p>
                    
                    <button id="restartQuizBtn" class="mt-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-6 py-3 rounded-2xl shadow-lg border-2 border-emerald-300 active:scale-95 transition-transform text-base md:text-lg flex items-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i> Play Again
                    </button>
                </div>

            </div>
        </div>

    </div>

    <script>
        const FAMILY_TILES = [
            { id: 'dad', img: 'dad.png', soundWord: 'dad', color: 'bg-amber-100 border-amber-400' },
            { id: 'grandma', img: 'grandma.png', soundWord: 'grandma', color: 'bg-pink-100 border-pink-400' },
            { id: 'grandpa', img: 'grandpa.png', soundWord: 'grandpa', color: 'bg-orange-100 border-orange-400' },
            { id: 'mom', img: 'mom.png', soundWord: 'mom', color: 'bg-rose-100 border-rose-400' },
            { id: 'people', img: 'people.png', soundWord: 'people', color: 'bg-sky-100 border-sky-400' },
            { id: 'uncle', img: 'uncle.png', soundWord: 'uncle', color: 'bg-lime-100 border-lime-500' }
        ];

        const OTHER_TILES = [
            { id: 'boat', img: 'boat.png', soundWord: 'boat', color: 'bg-blue-100 border-blue-400' },
            { id: 'buy', img: 'buy.png', soundWord: 'buy', color: 'bg-emerald-100 border-emerald-400' },
            { id: 'fish', img: 'fish.png', soundWord: 'fish', color: 'bg-cyan-100 border-cyan-400' },
            { id: 'fishing', img: 'fishing.png', soundWord: 'fishing', color: 'bg-purple-100 border-purple-400' },
            { id: 'goes', img: 'goes.png', soundWord: 'goes', color: 'bg-green-100 border-green-500' },
            { id: 'huayu', img: 'huayu.png', soundWord: 'huayu', color: 'bg-teal-100 border-teal-400' },
            { id: 'squid', img: 'squid.png', soundWord: 'squid', color: 'bg-red-100 border-red-400' },
            { id: 'Taiwan', img: 'Taiwan.png', soundWord: 'Taiwan', color: 'bg-indigo-100 border-indigo-400' },
            { id: 'works', img: 'works.png', soundWord: 'works', color: 'bg-fuchsia-100 border-fuchsia-400' }
        ];

        const familyTilesContainer = document.getElementById('familyTilesContainer');
        const otherTilesContainer = document.getElementById('otherTilesContainer');
        const boardCanvas = document.getElementById('boardCanvas');
        const clearBoardBtn = document.getElementById('clearBoardBtn');
        const trashZone = document.getElementById('trashZone');

        // Quiz DOM
        const quizToggleBtn = document.getElementById('quizToggleBtn');
        const quizOverlay = document.getElementById('quizOverlay');
        const closeQuizBtn = document.getElementById('closeQuizBtn');
        const quizCategoryState = document.getElementById('quizCategoryState');
        const quizActiveState = document.getElementById('quizActiveState');
        const quizResultState = document.getElementById('quizResultState');
        const quizQuestionCount = document.getElementById('quizQuestionCount');
        const playQuizSoundBtn = document.getElementById('playQuizSoundBtn');
        const quizChoicesContainer = document.getElementById('quizChoicesContainer');
        const quizScoreText = document.getElementById('quizScoreText');
        const restartQuizBtn = document.getElementById('restartQuizBtn');

        let highestZIndex = 10;

        // Quiz state variables
        let selectedCategoryPool = [];
        let currentQuizStep = 0;
        let quizScore = 0;
        let quizQuestions = [];
        let currentTargetTile = null;

        function playTileSound(word) {
            const audioPath = `${word}.mp3`;
            const audio = new Audio(audioPath);

            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(word);
                        utterance.rate = 0.9;
                        utterance.pitch = 1.1;
                        utterance.lang = 'en-US';
                        window.speechSynthesis.speak(utterance);
                    }
                });
            }
        }

        function renderSidebarTile(tile, container) {
            const tileBtn = document.createElement('button');
            tileBtn.className = `tile-frame relative flex-shrink-0 w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 rounded-2xl border-4 ${tile.color} p-2 bg-white flex items-center justify-center cursor-pointer active:scale-90 transition-transform`;
            
            const img = document.createElement('img');
            img.src = tile.img;
            img.alt = "";
            img.className = "w-full h-full object-contain pointer-events-none";
            img.onerror = () => {
                img.src = `https://placehold.co/150x150/FFD166/333333?text=?`;
            };

            tileBtn.appendChild(img);

            tileBtn.addEventListener('click', () => {
                playTileSound(tile.soundWord);
                createBoardTile(tile);
            });

            container.appendChild(tileBtn);
        }

        FAMILY_TILES.forEach(tile => renderSidebarTile(tile, familyTilesContainer));
        OTHER_TILES.forEach(tile => renderSidebarTile(tile, otherTilesContainer));

        function createBoardTile(tileInfo) {
            const tileEl = document.createElement('div');
            tileEl.className = `draggable-tile tile-frame w-20 h-20 sm:w-24 sm:h-24 md:w-28 md:h-28 rounded-2xl md:rounded-3xl border-4 ${tileInfo.color} p-2.5 bg-white flex items-center justify-center`;
            
            const img = document.createElement('img');
            img.src = tileInfo.img;
            img.alt = "";
            img.className = "w-full h-full object-contain pointer-events-none";
            img.onerror = () => {
                img.src = `https://placehold.co/150x150/FFD166/333333?text=?`;
            };

            const removeBadge = document.createElement('button');
            removeBadge.className = "absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 md:w-7 md:h-7 flex items-center justify-center text-xs shadow-md border-2 border-white hover:bg-red-600 transition-transform active:scale-90 z-20";
            removeBadge.innerHTML = `<i class="fa-solid fa-xmark"></i>`;
            removeBadge.addEventListener('click', (e) => {
                e.stopPropagation();
                removeTileWithAnimation(tileEl);
            });

            tileEl.appendChild(img);
            tileEl.appendChild(removeBadge);

            const rect = boardCanvas.getBoundingClientRect();
            const tileWidth = 90;
            const tileHeight = 90;
            const padding = 20;
            const maxX = Math.max(0, rect.width - tileWidth - padding);
            const maxY = Math.max(0, rect.height - tileHeight - padding);

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            tileEl.style.left = `${randomX}px`;
            tileEl.style.top = `${randomY}px`;
            tileEl.style.zIndex = ++highestZIndex;

            tileEl.addEventListener('click', () => {
                if (!tileEl.dataset.isDragging || tileEl.dataset.isDragging === "false") {
                    playTileSound(tileInfo.soundWord);
                    tileEl.style.zIndex = ++highestZIndex;
                }
            });

            tileEl.addEventListener('dblclick', () => {
                removeTileWithAnimation(tileEl);
            });

            makeTileDraggable(tileEl);

            boardCanvas.appendChild(tileEl);

            tileEl.animate([
                { transform: 'scale(0.2) rotate(-10deg)', opacity: 0 },
                { transform: 'scale(1) rotate(0deg)', opacity: 1 }
            ], {
                duration: 250,
                easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.275)'
            });
        }

        function makeTileDraggable(element) {
            let active = false;
            let xOffset = 0, yOffset = 0;

            element.addEventListener('mousedown', dragStart);
            element.addEventListener('touchstart', dragStart, { passive: false });

            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag, { passive: false });

            window.addEventListener('mouseup', dragEnd);
            window.addEventListener('touchend', dragEnd);

            function dragStart(e) {
                if (e.target.closest('button')) return;

                element.style.zIndex = ++highestZIndex;
                element.dataset.isDragging = "false";

                const clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;

                const rect = element.getBoundingClientRect();
                xOffset = clientX - rect.left;
                yOffset = clientY - rect.top;

                active = true;
            }

            function drag(e) {
                if (!active) return;
                
                e.preventDefault();
                element.dataset.isDragging = "true";

                const clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;

                const canvasRect = boardCanvas.getBoundingClientRect();
                
                let left = clientX - canvasRect.left - xOffset;
                let top = clientY - canvasRect.top - yOffset;

                left = Math.max(0, Math.min(left, canvasRect.width - element.offsetWidth));
                top = Math.max(0, Math.min(top, canvasRect.height - element.offsetHeight));

                element.style.left = `${left}px`;
                element.style.top = `${top}px`;

                const trashRect = trashZone.getBoundingClientRect();
                const tileRect = element.getBoundingClientRect();

                if (isOverlapping(tileRect, trashRect)) {
                    trashZone.classList.add('drag-over');
                } else {
                    trashZone.classList.remove('drag-over');
                }
            }

            function dragEnd() {
                if (!active) return;
                active = false;

                const trashRect = trashZone.getBoundingClientRect();
                const tileRect = element.getBoundingClientRect();

                if (isOverlapping(tileRect, trashRect)) {
                    removeTileWithAnimation(element);
                }

                trashZone.classList.remove('drag-over');

                setTimeout(() => {
                    element.dataset.isDragging = "false";
                }, 50);
            }
        }

        function isOverlapping(rect1, rect2) {
            return !(
                rect1.right < rect2.left ||
                rect1.left > rect2.right ||
                rect1.bottom < rect2.top ||
                rect1.top > rect2.bottom
            );
        }

        function removeTileWithAnimation(element) {
            const anim = element.animate([
                { transform: 'scale(1)', opacity: 1 },
                { transform: 'scale(0) rotate(20deg)', opacity: 0 }
            ], {
                duration: 200,
                easing: 'ease-in'
            });

            anim.onfinish = () => element.remove();
        }

        clearBoardBtn.addEventListener('click', () => {
            const tiles = boardCanvas.querySelectorAll('.draggable-tile');
            tiles.forEach((tile, index) => {
                setTimeout(() => {
                    removeTileWithAnimation(tile);
                }, index * 30);
            });
        });

        // ================= QUIZ MODE LOGIC ================= //

        function openQuizModal() {
            quizCategoryState.classList.remove('hidden');
            quizActiveState.classList.add('hidden');
            quizResultState.classList.add('hidden');
            quizOverlay.classList.remove('hidden');
        }

        function selectQuizCategory(categoryKey) {
            selectedCategoryPool = categoryKey === 'family' ? FAMILY_TILES : OTHER_TILES;
            
            // Pick 5 random target questions from the chosen category
            quizQuestions = [...selectedCategoryPool].sort(() => 0.5 - Math.random()).slice(0, 5);
            currentQuizStep = 0;
            quizScore = 0;

            quizCategoryState.classList.add('hidden');
            quizActiveState.classList.remove('hidden');

            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            if (currentQuizStep >= 5) {
                showQuizResults();
                return;
            }

            quizQuestionCount.textContent = `Question ${currentQuizStep + 1} of 5`;
            currentTargetTile = quizQuestions[currentQuizStep];

            // Pick 2 distractors from the same category pool
            const distractors = selectedCategoryPool
                .filter(tile => tile.id !== currentTargetTile.id)
                .sort(() => 0.5 - Math.random())
                .slice(0, 2);

            const choices = [currentTargetTile, ...distractors].sort(() => 0.5 - Math.random());

            quizChoicesContainer.innerHTML = '';
            choices.forEach(choice => {
                const choiceBtn = document.createElement('button');
                choiceBtn.className = `tile-frame w-full aspect-square rounded-2xl border-4 ${choice.color} p-2 bg-white flex items-center justify-center active:scale-95 transition-transform`;
                
                const img = document.createElement('img');
                img.src = choice.img;
                img.alt = "";
                img.className = "w-full h-full object-contain pointer-events-none";
                img.onerror = () => {
                    img.src = `https://placehold.co/150x150/FFD166/333333?text=?`;
                };

                choiceBtn.appendChild(img);

                choiceBtn.addEventListener('click', () => handleQuizAnswer(choice, choiceBtn));
                quizChoicesContainer.appendChild(choiceBtn);
            });

            setTimeout(() => {
                playTileSound(currentTargetTile.soundWord);
            }, 300);
        }

        function handleQuizAnswer(selectedTile, buttonEl) {
            if (selectedTile.id === currentTargetTile.id) {
                quizScore++;
                buttonEl.classList.add('ring-8', 'ring-emerald-400', 'bg-emerald-50');
                playTileSound(selectedTile.soundWord);

                setTimeout(() => {
                    currentQuizStep++;
                    loadQuizQuestion();
                }, 1000);
            } else {
                buttonEl.classList.add('animate-shake', 'ring-4', 'ring-red-400', 'opacity-50');
                playTileSound(selectedTile.soundWord);
            }
        }

        function showQuizResults() {
            quizActiveState.classList.add('hidden');
            quizResultState.classList.remove('hidden');
            quizScoreText.textContent = `You scored ${quizScore} out of 5!`;
        }

        playQuizSoundBtn.addEventListener('click', () => {
            if (currentTargetTile) {
                playTileSound(currentTargetTile.soundWord);
            }
        });

        quizToggleBtn.addEventListener('click', openQuizModal);
        restartQuizBtn.addEventListener('click', openQuizModal);
        closeQuizBtn.addEventListener('click', () => quizOverlay.classList.add('hidden'));
    </script>
</body>
</html>
